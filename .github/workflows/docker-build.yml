name: ASF-docker-build

# 触发条件：推送 main 分支 / 推送 v* 标签 / 手动触发
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      configuration:
        description: 构建配置（Debug 用于排障）
        type: choice
        default: Release
        options:
          - Release
          - Debug

env:
  # 目标架构（与官方一致；GitHub 托管 runner 自带 arm 仿真，无需额外 QEMU 步骤）
  PLATFORMS: linux/amd64,linux/arm,linux/arm64

concurrency:
  group: docker-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout（含 ASF-ui 子模块）
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像名与标签
        id: meta
        shell: sh
        run: |
          set -eu

          IMAGE="ghcr.io/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/archisteamfarm"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"

          SHA_TAG="sha-${GITHUB_SHA::7}"

          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
            TAGS="${IMAGE}:${VERSION},${IMAGE}:latest,${IMAGE}:${SHA_TAG}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAGS="${IMAGE}:manual,${IMAGE}:${SHA_TAG}"
          else
            TAGS="${IMAGE}:main,${IMAGE}:${SHA_TAG}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build & Push Docker image（自建 Dockerfile）
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # Release 为默认；手动触发时可通过输入框选择 Debug
          build-args: CONFIGURATION=${{ inputs.configuration || 'Release' }}
          # 利用 GitHub Actions 缓存加速重复构建
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: 输出镜像信息
        shell: sh
        run: |
          echo "镜像已推送：${{ steps.meta.outputs.image }}"
          echo "标签：${{ steps.meta.outputs.tags }}"
